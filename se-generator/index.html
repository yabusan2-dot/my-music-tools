<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://googleapis.com" />
    <title>JS効果音メーカー</title>
    <style>
        body { font-family: "Helvetica Neue", Arial, "Hiragino Sans",
  "Noto Sans JP", sans-serif,
  "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji"; background: #1e1e24; color: #fff; padding: 15px; max-width: 500px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-bottom: 15px; }
        button { background: #00bcd4; border: none; padding: 8px; font-weight: bold; cursor: pointer; border-radius: 4px; color: #1e1e24; font-size: 0.85rem; }
        button.preset { background: #444; color: #ccc; }
        button.preset:hover { background: #555; color: #fff; }
        .row { margin-bottom: 10px; display: flex; flex-direction: column; }
        input, select { width: 100%; padding: 5px; box-sizing: border-box; background: #333; color: #fff; border: 1px solid #555; }
        .favs { background: #333; padding: 8px; max-height: 80px; overflow-y: auto; margin-bottom: 15px; font-size: 0.85rem; }
        pre { background: #111; padding: 10px; max-height: 120px; overflow: auto; color: #a9ffb4; font-size: 0.75rem; }
        
        /* 🎨 波形図・変化図表示用の共通スタイル */
        .wave-ui-group { display: flex; gap: 10px; align-items: center; }
        .wave-preview-box { width: 60px; height: 34px; background: #111; border: 1px solid #555; border-radius: 4px; display: flex; align-items: center; justify-content: center; }
        .wave-svg { stroke: #00bcd4; stroke-width: 2; fill: none; }
        .ramp-svg { stroke: #ff9800; stroke-width: 2; fill: none; } /* 変化図はオレンジ色に */
    </style>
</head>
<body>
    <h3>🔊 効果音メーカー</h3>
    <div class="grid">
        <button class="preset" onclick="loadP('explosion')">💥爆発</button>
        <button class="preset" onclick="loadP('sandstorm')">📺砂嵐</button>
        <button class="preset" onclick="loadP('laser')">🔫レーザー</button>
        <button class="preset" onclick="loadP('coin')">💰コイン</button>
        <button class="preset" onclick="loadP('jump')">🦘ジャンプ</button>
        <button class="preset" onclick="loadP('hit')">🥊打撃</button>
        <button class="preset" onclick="loadP('frog')">🐸カエル</button>
        <button class="preset" onclick="loadP('bird')">🕊️鳥</button>
        <button class="preset" onclick="loadP('insect')">🐝虫（多重）</button>
        <button class="preset" onclick="loadP('sword')">⚔️剣（多重）</button>
        <button class="preset" onclick="loadP('warp')">🌀ワープ（多重）</button>
        <button class="preset" onclick="loadP('magic')">🧙‍魔法（多重）</button>
    </div>
    <div style="display:flex; gap:5px; margin-bottom:15px;">
        <input type="text" id="fIn" placeholder="お気に入りの名前" style="flex:1;">
        <button onclick="saveF()">保存</button>
    </div>
    <div class="favs" id="fList"></div>

    <div class="row"><label>エコーの強さ: <span id="v-echo">0.6</span></label><input type="range" id="echo" min="0" max="0.8" step="0.1" value="0.6" oninput="up()" onchange="play()"></div>
    <div class="row"><label>ノイズ比: <span id="v-nMix">0.0</span></label><input type="range" id="nMix" min="0" max="1" step="0.1" value="0" oninput="up()" onchange="play()"></div>
    
    <!-- トーン波形UI -->
    <div class="row">
        <label>波形（音色）</label>
        <div class="wave-ui-group">
            <select id="type" onchange="drawWaveIcon(); up(); play();" style="flex: 1;">
                <option value="sine">sine（滑らか・丸い波）</option>
                <option value="square">square（ピコピコ・四角波）</option>
                <option value="sawtooth">sawtooth（ギザギザ・のこぎり波）</option>
                <option value="triangle">triangle（ファミコン・三角波）</option>
            </select>
            <div class="wave-preview-box" id="wavePreview"></div>
        </div>
    </div>

<!-- 初期状態は display: none; にしておきます -->
<div class="fm-container" style="display: flex; justify-content: space-between; gap: 10px;">
    <div class="row" style="flex:1">
        <label>FM 変化速度 (Hz):</label>
        <input type="number" id="rate" value="0" min="0" max="2000" step="10" oninput="up()" onchange="play()">
    </div>
    <div class="row" style="flex:1">
        <label>FM 変化強度/揺らぎ:</label>
        <input type="number" id="amp" value="300" min="0" max="1000" step="5" oninput="up()" onchange="play()">
    </div>
</div>

    <div class="row"><label>始動周波数(Hz): <span id="v-sF">150</span></label><input type="range" id="sF" min="40" max="8000" step="10" value="150" oninput="drawRampIcon(); up();" onchange="play()"></div>
    <div class="row"><label>終了周波数(Hz): <span id="v-eF">600</span></label><input type="range" id="eF" min="40" max="8000" step="10" value="600" oninput="drawRampIcon(); up();" onchange="play()"></div>
    <div class="row"><label>長さ(秒): <span id="v-dur">0.35</span></label><input type="range" id="dur" min="0.05" max="2" step="0.05" value="0.35" oninput="up()" onchange="play()"></div>
    
    <div class="row">
        <label>変化型（周波数の変化）</label>
        <div class="wave-ui-group">
            <select id="ramp" onchange="drawRampIcon(); up(); play();" style="flex: 1;">
                <option value="linear">linear（直線的な変化）</option>
                <option value="exponential" selected>exponential（なめらかな変化）</option>
                <option value="jump">jump（途中で一瞬で跳ねる）</option>
            </select>
            <!-- ここにJavaScriptで変化図が描画されます -->
            <div class="wave-preview-box" id="rampPreview"></div>
        </div>
    </div>
    <div class="single-multi" style="display: flex; justify-content: space-between; gap: 10px;">
    <button style="width:50%; margin-bottom:5px;" onclick="play()">▶ 単音試聴</button>
    <button style="width:50%; margin-bottom:5px;background:#008cba; color:#fff;" onclick="playMulti()">▶ 多重合成音</button>
    </div>
    <div class="single-multi-save" style="display: flex; justify-content: space-between; gap: 10px;">
    <button style="width:50%; margin-bottom:5px;" onclick="dlWav()">📥 単音WAV保存</button>
    <button style="width:50%; margin-bottom:5px;background:#008cba; color:#fff;" onclick="dlWavml()">📥 合成WAV保存</button>
    </div>
    <div style="margin-top:10px; display:flex; justify-content:space-between; align-items:center;"><span>📋 出力コード:</span><button style="background:#4caf50; color:#fff; padding:2px 6px; font-size:0.7rem;" onclick="copyC()">コピー</button></div>
    <pre id="cText"></pre>

    <script src="app.js"></script>
</body>
</html>
