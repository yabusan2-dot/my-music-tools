<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>🔍 拡大波形モニター (Audio Loop Processor)</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #050608;
      overflow: hidden;
      display: flex;
      flex-direction: column; 
      user-select: none;
    }
    
    .info-bar {
      width: 100%;
      height: 35px; 
      background-color: #111420;
      border-bottom: 1px solid #23283d;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      box-sizing: border-box;
      font-family: monospace;
      font-size: 12px;
      color: #a0aec0;
    }
    .info-bar span {
      color: #fff;
    }
    .time-counter {
      background-color: #090a0f;
      padding: 3px 10px;
      border-radius: 4px;
      border: 1px solid #303b4d;
    }
    .time-counter strong {
      color: #78ffd6; 
      font-size: 13px;
    }

    .canvas-container {
      flex-grow: 1;
      width: 100%;
      height: calc(100vh - 35px); 
      position: relative;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }
  </style>
</head>
<body>

  <!-- デジタルカウンター表示バー -->
  <div class="info-bar">
    <div>📊 ZOOM MONITOR <span id="zoomStatus">(全体表示中)</span></div>
    <div class="time-counter">
      START: <strong id="digitalStart">0.000s</strong> &nbsp;|&nbsp; 
      END: <strong id="digitalEnd">0.000s</strong> &nbsp;|&nbsp;
      DURATION: <strong id="digitalDiff">0.000s</strong>
    </div>
    <div style="font-size: 11px; color: #718096;">※ダブルクリックでリセット</div>
  </div>

  <div class="canvas-container">
    <canvas id="largeCanvas"></canvas>
  </div>

  <script src="wave-renderer.js"></script>
  <script src="popout-zoom.js"></script>
  <script>
      const canvas = document.getElementById('largeCanvas');
      const ctx = canvas.getContext('2d');

    window.addEventListener('resize', refreshWaveform);

    // マウスドラッグ範囲指定
    canvas.addEventListener('mousedown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const canvasX = e.clientX - rect.left;
      if (canvasX < marginLeft) return;
      isDragging = true;
      dragStartX = e.clientX;
      dragCurrentX = e.clientX;
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      dragCurrentX = Math.max(marginLeft, e.clientX);
      refreshWaveform();

      ctx.fillStyle = 'rgba(79, 172, 254, 0.3)';
      ctx.strokeStyle = '#4facfe';
      ctx.lineWidth = 1;
      const x = Math.min(dragStartX, dragCurrentX);
      const width = Math.abs(dragStartX - dragCurrentX);
      const height = canvas.height - 20;
      ctx.fillRect(x, 0, width, height);
      ctx.strokeRect(x, 0, width, height);
    });

    window.addEventListener('mouseup', () => {
      if (!isDragging) return;
      isDragging = false;
      const dragWidth = Math.abs(dragStartX - dragCurrentX);
      if (dragWidth > 5) {
        const drawWidth = canvas.width - marginLeft;
        const xMin = Math.min(dragStartX, dragCurrentX) - marginLeft;
        const xMax = Math.max(dragStartX, dragCurrentX) - marginLeft;
        const currentRange = zoomEndRatio - zoomStartRatio;
        const newStartRatio = zoomStartRatio + (xMin / drawWidth) * currentRange;
        const newEndRatio = zoomStartRatio + (xMax / drawWidth) * currentRange;
        zoomStartRatio = Math.max(0.0, newStartRatio);
        zoomEndRatio = Math.min(1.0, newEndRatio);
      }
      refreshWaveform();
    });

    canvas.addEventListener('dblclick', () => {
      zoomStartRatio = 0.0;
      zoomEndRatio = 1.0;
      refreshWaveform();
    });

    window.addEventListener('DOMContentLoaded', () => {
      refreshWaveform();
    });

  </script>

</body>
</html>
